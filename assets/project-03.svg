<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="p3Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="25" y="20" width="550" height="340" rx="14" fill="#0B0F19" stroke="#F59E0B" stroke-width="2" filter="url(#p3Shadow)"/>

  <!-- Header -->
  <rect x="25" y="20" width="550" height="42" rx="14" fill="#1C1917"/>
  <rect x="25" y="50" width="550" height="12" fill="#1C1917"/>
  <circle cx="50" cy="41" r="6" fill="#EF4444"/>
  <circle cx="70" cy="41" r="6" fill="#F59E0B"/>
  <circle cx="90" cy="41" r="6" fill="#10B981"/>
  <text x="300" y="46" fill="#FCD34D" font-family="monospace" font-size="13" text-anchor="middle">JavaScript ES6+ — Dynamic DOM Mutation &amp; Events</text>

  <!-- Left: Event Lifecycle Diagram -->
  <g transform="translate(50, 85)">
    <!-- Node 1: User Action -->
    <rect x="0" y="0" width="180" height="46" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="15" y="28" fill="#FDE68A" font-family="monospace" font-weight="700" font-size="11">1. User Click / Input</text>

    <!-- Arrow down -->
    <path d="M90 46 L90 70 M85 64 L90 70 L95 64" stroke="#F59E0B" stroke-width="2" fill="none"/>

    <!-- Node 2: Event Firing -->
    <rect x="0" y="70" width="180" height="46" rx="8" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="15" y="98" fill="#93C5FD" font-family="monospace" font-weight="700" font-size="11">2. Event Dispatched</text>

    <!-- Arrow down -->
    <path d="M90 116 L90 140 M85 134 L90 140 L95 134" stroke="#60A5FA" stroke-width="2" fill="none"/>

    <!-- Node 3: JS Callback -->
    <rect x="0" y="140" width="180" height="46" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="15" y="168" fill="#D8B4FE" font-family="monospace" font-weight="700" font-size="11">3. Callback Handler</text>

    <!-- Arrow down -->
    <path d="M90 186 L90 210 M85 204 L90 210 L95 204" stroke="#A855F7" stroke-width="2" fill="none"/>

    <!-- Node 4: DOM Mutation -->
    <rect x="0" y="210" width="180" height="46" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <text x="15" y="238" fill="#6EE7B7" font-family="monospace" font-weight="700" font-size="11">4. DOM / CSS Mutation</text>
  </g>

  <!-- Right: Code Snippet & Interactive Live Component -->
  <g transform="translate(260, 85)">
    <rect width="290" height="150" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="15" y="28" fill="#F43F5E" font-family="monospace" font-size="11">const</text>
    <text x="55" y="28" fill="#E2E8F0" font-family="monospace" font-size="11">btn = document.querySelector(</text>
    <text x="15" y="48" fill="#10B981" font-family="monospace" font-size="11">  '#themeToggle'</text>
    <text x="120" y="48" fill="#E2E8F0" font-family="monospace" font-size="11">);</text>

    <text x="15" y="78" fill="#E2E8F0" font-family="monospace" font-size="11">btn.addEventListener(</text>
    <text x="165" y="78" fill="#10B981" font-family="monospace" font-size="11">'click'</text>
    <text x="215" y="78" fill="#E2E8F0" font-family="monospace" font-size="11">, () =&gt; {</text>
    
    <text x="30" y="100" fill="#E2E8F0" font-family="monospace" font-size="11">document.body.classList.toggle(</text>
    <text x="30" y="118" fill="#10B981" font-family="monospace" font-size="11">  'light-theme'</text>
    <text x="135" y="118" fill="#E2E8F0" font-family="monospace" font-size="11">);</text>
    <text x="15" y="138" fill="#E2E8F0" font-family="monospace" font-size="11">});</text>

    <!-- Dynamic interactive result card -->
    <rect x="0" y="165" width="290" height="90" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="35" cy="205" r="16" fill="#F59E0B"/>
    <text x="35" y="210" fill="#000" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">⚡</text>
    <text x="65" y="198" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">Interactive State Synchronized</text>
    <text x="65" y="218" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Dynamic class manipulation &amp; CSS root variables</text>
    <rect x="65" y="230" width="80" height="15" rx="7" fill="#10B981" opacity="0.3"/>
    <text x="75" y="241" fill="#34D399" font-family="monospace" font-size="9">60 FPS Smooth</text>
  </g>
</svg>
