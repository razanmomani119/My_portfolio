<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="p2Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="25" y="20" width="550" height="340" rx="14" fill="#0B132B" stroke="#059669" stroke-width="2" filter="url(#p2Shadow)"/>

  <!-- Header -->
  <rect x="25" y="20" width="550" height="42" rx="14" fill="#064E3B"/>
  <rect x="25" y="50" width="550" height="12" fill="#064E3B"/>
  <circle cx="50" cy="41" r="6" fill="#EF4444"/>
  <circle cx="70" cy="41" r="6" fill="#F59E0B"/>
  <circle cx="90" cy="41" r="6" fill="#10B981"/>
  <text x="300" y="46" fill="#A7F3D0" font-family="monospace" font-size="13" text-anchor="middle">CSS3 Layout Engine — Flexbox &amp; Grid Matrix</text>

  <!-- Desktop Screen Mockup -->
  <g transform="translate(50, 85)">
    <rect width="320" height="210" rx="8" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="25" rx="8" fill="#1F2937"/>
    <text x="12" y="17" fill="#6EE7B7" font-family="monospace" font-size="11">Desktop Viewport (1440px)</text>
    
    <!-- CSS Grid items -->
    <rect x="15" y="38" width="90" height="75" rx="6" fill="#047857" opacity="0.8"/>
    <text x="25" y="75" fill="#FFFFFF" font-family="monospace" font-size="11">grid-area: A</text>
    <text x="25" y="92" fill="#A7F3D0" font-family="monospace" font-size="9">flex: 1 1 auto</text>

    <rect x="115" y="38" width="190" height="75" rx="6" fill="#0D9488" opacity="0.8"/>
    <text x="130" y="75" fill="#FFFFFF" font-family="monospace" font-size="11">grid-area: Hero</text>
    <text x="130" y="92" fill="#A7F3D0" font-family="monospace" font-size="9">display: flex; center</text>

    <rect x="15" y="123" width="140" height="60" rx="6" fill="#059669" opacity="0.8"/>
    <text x="25" y="155" fill="#FFFFFF" font-family="monospace" font-size="11">Card 01</text>
    <text x="25" y="170" fill="#A7F3D0" font-family="monospace" font-size="9">gap: 1.5rem</text>

    <rect x="165" y="123" width="140" height="60" rx="6" fill="#059669" opacity="0.8"/>
    <text x="175" y="155" fill="#FFFFFF" font-family="monospace" font-size="11">Card 02</text>
    <text x="175" y="170" fill="#A7F3D0" font-family="monospace" font-size="9">transition: all 0.3s</text>
  </g>

  <!-- Mobile Screen Mockup -->
  <g transform="translate(400, 85)">
    <rect width="145" height="240" rx="18" fill="#111827" stroke="#34D399" stroke-width="2"/>
    <!-- Speaker & Camera -->
    <circle cx="72" cy="12" r="3" fill="#374151"/>
    <rect x="52" y="7" width="40" height="3" rx="1.5" fill="#374151"/>

    <!-- Screen Content Stacked Vertically (Mobile Responsive) -->
    <rect x="12" y="25" width="121" height="35" rx="5" fill="#0D9488" opacity="0.8"/>
    <text x="20" y="46" fill="#FFFFFF" font-family="monospace" font-size="9">Stacked Column</text>

    <rect x="12" y="68" width="121" height="45" rx="5" fill="#047857" opacity="0.8"/>
    <text x="20" y="92" fill="#FFFFFF" font-family="monospace" font-size="9">Responsive Flex</text>

    <rect x="12" y="120" width="121" height="45" rx="5" fill="#059669" opacity="0.8"/>
    <text x="20" y="145" fill="#FFFFFF" font-family="monospace" font-size="9">Media Query @768</text>

    <rect x="12" y="172" width="121" height="45" rx="5" fill="#059669" opacity="0.8"/>
    <text x="20" y="198" fill="#FFFFFF" font-family="monospace" font-size="9">Touch Friendly</text>
  </g>
</svg>
