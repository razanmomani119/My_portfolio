<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="proBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDDEC0"/>
      <stop offset="100%" stop-color="#EAB892"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with modern glow -->
  <circle cx="200" cy="200" r="185" fill="url(#proBg)"/>
  <circle cx="200" cy="200" r="175" fill="#0B132B" opacity="0.15"/>

  <!-- Subtle code particles / symbols -->
  <text x="50" y="90" fill="#ffffff" opacity="0.25" font-family="monospace" font-size="20">&lt;/&gt;</text>
  <text x="320" y="110" fill="#ffffff" opacity="0.25" font-family="monospace" font-size="18">{ }</text>
  <text x="60" y="310" fill="#ffffff" opacity="0.25" font-family="monospace" font-size="18">0101</text>
  <text x="310" y="320" fill="#ffffff" opacity="0.25" font-family="monospace" font-size="22">=&gt;</text>

  <!-- Developer Group -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Blazer -->
    <path d="M90 380 C 110 300, 150 270, 200 270 C 250 270, 290 300, 310 380 Z" fill="url(#suitGrad)"/>
    
    <!-- White Collared Shirt -->
    <path d="M165 270 L 200 325 L 235 270 Z" fill="#F8FAFC"/>
    <!-- Blue Tie -->
    <path d="M195 285 L 205 285 L 208 340 L 200 355 L 192 340 Z" fill="#3B82F6"/>

    <!-- Neck -->
    <path d="M178 220 L 178 275 C 178 285, 222 285, 222 275 L 222 220 Z" fill="url(#skinGrad)"/>

    <!-- Head & Face -->
    <ellipse cx="200" cy="180" rx="60" ry="72" fill="url(#skinGrad)"/>

    <!-- Professional Hair -->
    <path d="M138 170 C 135 120, 160 100, 200 100 C 245 100, 265 120, 262 165 C 250 145, 230 135, 200 135 C 165 135, 148 150, 138 170 Z" fill="#1E293B"/>

    <!-- Eyebrows -->
    <path d="M160 156 Q 172 152 184 156" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M216 156 Q 228 152 240 156" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <circle cx="172" cy="172" r="5" fill="#1E293B"/>
    <circle cx="228" cy="172" r="5" fill="#1E293B"/>
    <circle cx="174" cy="170" r="1.5" fill="#FFFFFF"/>
    <circle cx="230" cy="170" r="1.5" fill="#FFFFFF"/>

    <!-- Modern Glasses -->
    <rect x="153" y="160" width="38" height="24" rx="7" fill="none" stroke="#0F172A" stroke-width="3.5"/>
    <rect x="209" y="160" width="38" height="24" rx="7" fill="none" stroke="#0F172A" stroke-width="3.5"/>
    <line x1="191" y1="172" x2="209" y2="172" stroke="#0F172A" stroke-width="3.5"/>
    <line x1="138" y1="168" x2="153" y2="170" stroke="#0F172A" stroke-width="3.5"/>
    <line x1="247" y1="170" x2="262" y2="168" stroke="#0F172A" stroke-width="3.5"/>

    <!-- Nose -->
    <path d="M197 180 Q 200 193 205 193" stroke="#D79B75" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Confident Smile -->
    <path d="M182 212 Q 200 226 218 212" stroke="#B45309" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Professional Status Badge -->
  <g transform="translate(255, 290)">
    <rect width="115" height="34" rx="17" fill="#10B981" filter="url(#shadow)"/>
    <circle cx="18" cy="17" r="5" fill="#FFFFFF"/>
    <text x="32" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12">READY TO HIRE</text>
  </g>
</svg>
