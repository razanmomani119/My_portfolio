<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="p1Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="25" y="20" width="550" height="340" rx="14" fill="url(#p1Bg)" stroke="#4338CA" stroke-width="2" filter="url(#p1Shadow)"/>

  <!-- Browser Header -->
  <rect x="25" y="20" width="550" height="42" rx="14" fill="#312E81"/>
  <rect x="25" y="50" width="550" height="12" fill="#312E81"/>
  
  <circle cx="50" cy="41" r="6" fill="#EF4444"/>
  <circle cx="70" cy="41" r="6" fill="#F59E0B"/>
  <circle cx="90" cy="41" r="6" fill="#10B981"/>
  
  <!-- URL Bar -->
  <rect x="120" y="30" width="360" height="22" rx="6" fill="#1E1B4B"/>
  <text x="300" y="45" fill="#A5B4FC" font-family="monospace" font-size="12" text-anchor="middle">https://semantic-web-standards.html5</text>

  <!-- HTML Structure Diagram Inside Browser -->
  <!-- <header> tag box -->
  <rect x="50" y="80" width="500" height="45" rx="8" fill="#4338CA" opacity="0.4" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="65" y="108" fill="#C7D2FE" font-family="monospace" font-weight="700" font-size="13">&lt;header&gt; &amp; &lt;nav&gt; Accessibility Structure</text>

  <!-- Main Grid with <main> and <aside> -->
  <!-- <main> box -->
  <rect x="50" y="135" width="340" height="145" rx="8" fill="#3730A3" opacity="0.3" stroke="#6366F1" stroke-width="1.5"/>
  <text x="65" y="160" fill="#E0E7FF" font-family="monospace" font-weight="700" font-size="13">&lt;main role="main"&gt;</text>
  
  <!-- <article> inside <main> -->
  <rect x="65" y="172" width="310" height="48" rx="6" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1"/>
  <text x="80" y="196" fill="#38BDF8" font-family="monospace" font-size="12">&lt;article&gt; Semantic Content &lt;/article&gt;</text>
  <text x="80" y="212" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">High a11y score, SEO-optimized markup &amp; microdata</text>

  <!-- <section> inside <main> -->
  <rect x="65" y="226" width="310" height="42" rx="6" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1"/>
  <text x="80" y="248" fill="#F472B6" font-family="monospace" font-size="12">&lt;section aria-labelledby="..."&gt;</text>

  <!-- <aside> box -->
  <rect x="400" y="135" width="150" height="145" rx="8" fill="#312E81" opacity="0.4" stroke="#818CF8" stroke-width="1.5"/>
  <text x="415" y="160" fill="#E0E7FF" font-family="monospace" font-weight="700" font-size="12">&lt;aside&gt;</text>
  <rect x="415" y="172" width="120" height="96" rx="6" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1"/>
  <text x="425" y="198" fill="#34D399" font-family="monospace" font-size="11">Related Info</text>
  <text x="425" y="220" fill="#94A3B8" font-family="monospace" font-size="10">a11y: 100%</text>
  <text x="425" y="240" fill="#94A3B8" font-family="monospace" font-size="10">SEO: 100%</text>

  <!-- <footer> box -->
  <rect x="50" y="290" width="500" height="45" rx="8" fill="#4338CA" opacity="0.4" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="65" y="318" fill="#C7D2FE" font-family="monospace" font-weight="700" font-size="13">&lt;footer&gt; Clean semantic footnotes &amp; meta</text>
</svg>
