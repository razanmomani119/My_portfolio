<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="25" y="20" width="550" height="340" rx="14" fill="url(#termBg)" stroke="#334155" stroke-width="2" filter="url(#termShadow)"/>
  
  <!-- Window Header Bar -->
  <rect x="25" y="20" width="550" height="42" rx="14" fill="#1E293B"/>
  <rect x="25" y="50" width="550" height="12" fill="#1E293B"/>
  
  <!-- Traffic Light Window Buttons -->
  <circle cx="50" cy="41" r="6" fill="#EF4444"/>
  <circle cx="70" cy="41" r="6" fill="#F59E0B"/>
  <circle cx="90" cy="41" r="6" fill="#10B981"/>

  <!-- Window Title -->
  <text x="300" y="46" fill="#94A3B8" font-family="monospace" font-size="13" text-anchor="middle">bash — project00-unix-env — 80x24</text>

  <!-- Terminal Content Lines -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="14">
    <!-- Line 1 -->
    <text x="50" y="95" fill="#38BDF8">developer@terminal</text>
    <text x="210" y="95" fill="#94A3B8">:</text>
    <text x="220" y="95" fill="#A855F7">~/piscine/project00</text>
    <text x="390" y="95" fill="#F8FAFC">$ ./init_env.sh</text>

    <!-- Line 2 output -->
    <text x="50" y="125" fill="#10B981">[+] Initializing Unix Environment &amp; VIM Profiles...</text>
    <text x="50" y="150" fill="#10B981">[+] Configuring Git Hooks &amp; Automated Aliases... [OK]</text>
    <text x="50" y="175" fill="#64748B">[info] System architecture: x86_64 POSIX Compliant</text>

    <!-- Line 3 command -->
    <text x="50" y="215" fill="#38BDF8">developer@terminal</text>
    <text x="210" y="215" fill="#94A3B8">:</text>
    <text x="220" y="215" fill="#A855F7">~/piscine/project00</text>
    <text x="390" y="215" fill="#F8FAFC">$ ls -la scripts/</text>

    <!-- File listing output -->
    <text x="50" y="245" fill="#F59E0B">-rwxr-xr-x 1 user staff  2048 Oct 13 10:20 deploy.sh</text>
    <text x="50" y="270" fill="#F59E0B">-rwxr-xr-x 1 user staff  1540 Oct 13 10:22 backup.sh</text>
    <text x="50" y="295" fill="#F59E0B">-rw-r--r-- 1 user staff  3412 Oct 13 10:24 Makefile</text>

    <!-- Cursor prompt -->
    <text x="50" y="330" fill="#38BDF8">developer@terminal</text>
    <text x="210" y="330" fill="#94A3B8">:</text>
    <text x="220" y="330" fill="#A855F7">~/piscine/project00</text>
    <text x="390" y="330" fill="#F8FAFC">$ git status</text>
    <rect x="495" y="317" width="10" height="17" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
